name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-headless:
    name: Native C++ headless
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset headless-dev
      - name: Build
        run: cmake --build --preset headless-dev
      - name: Test
        run: ctest --preset headless-dev

  native-qt6:
    name: Native Qt6 desktop
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev qt6-charts-dev libgl1-mesa-dev
      - name: Configure
        run: cmake --preset desktop-dev
      - name: Build
        run: cmake --build --preset desktop-dev

  go-control-plane:
    name: Go control plane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go_control_plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: go_control_plane/go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python sources
        run: python -m compileall -q run.py python_ai_layer python_gui_dashboard python_tools
