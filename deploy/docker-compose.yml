# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml  –  ARX Platform full-stack deployment.
#
# Services:
#   arx_vision     – C++ vision engine  (requires --privileged for /dev/video*)
#   arx_ai         – Python AI layer    (reads SHM from arx_vision)
#   arx_control    – Go control plane   (ZMQ SUB + HTTP :8080)
#   arx_dashboard  – Python GUI         (connects to arx_control:8080/ws)
#
# NOTE: Shared memory is exchanged via /dev/shm bind mount across containers.
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

networks:
  arx_net:
    driver: bridge

volumes:
  arx_shm:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=256m

services:

  # ── Layer 1: C++ Vision Engine ────────────────────────────────────────────
  arx_vision:
    image: arx/vision:2.0
    build:
      context: ./cpp_vision_engine
      dockerfile: Dockerfile
    devices:
      - /dev/video0:/dev/video0
    volumes:
      - /dev/shm:/dev/shm
    environment:
      - ARX_CAMERA_ID=0
      - ARX_ZMQ_PORT=5556
    network_mode: host          # ZMQ binds to *; host mode simplifies ports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "arx_vision_engine"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Layer 2: Python AI Layer ──────────────────────────────────────────────
  arx_ai:
    image: arx/ai:2.0
    build:
      context: ./python_ai_layer
      dockerfile: Dockerfile
    depends_on:
      arx_vision:
        condition: service_healthy
    volumes:
      - /dev/shm:/dev/shm
    environment:
      - ARX_ZMQ_PORT=5557
      - ARX_USE_GPU=0            # set to 1 for MediaPipe GPU delegate
    network_mode: host
    restart: unless-stopped

  # ── Layer 3: Go Control Plane ──────────────────────────────────────────────
  arx_control:
    image: arx/control:2.0
    build:
      context: ./go_control_plane
      dockerfile: Dockerfile
    depends_on:
      - arx_ai
    ports:
      - "8080:8080"
    environment:
      - ARX_CPP_ZMQ=tcp://localhost:5556
      - ARX_AI_ZMQ=tcp://localhost:5557
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/system/ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Layer 4: Dashboard (headless / Xvfb for server deployments) ──────────
  arx_dashboard:
    image: arx/dashboard:2.0
    build:
      context: ./python_gui_dashboard
      dockerfile: Dockerfile
    depends_on:
      arx_control:
        condition: service_healthy
    environment:
      - ARX_WS_URL=ws://localhost:8080/ws
      - DISPLAY=:99
    network_mode: host
    restart: unless-stopped
